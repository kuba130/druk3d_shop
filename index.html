<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Druk3D - Sklep z wydrukami 3D</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo"><span class="logo-icon">🖨️</span><h1>Druk3D Shop</h1></div>
            <nav>
                <a href="./index.html" class="nav-link active">Sklep</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Wydruki 3D na zamówienie</h2>
            <p>Wybierz produkt i złóż zamówienie</p>
        </section>
        <div id="productsGrid" class="products-grid"></div>
        <div id="emptyMessage" class="empty-message" style="display:none;"><div class="empty-icon">📦</div><h3>Brak produktów</h3></div>
        <div id="loadingMessage" class="empty-message"><div class="empty-icon">⏳</div><h3>Ładowanie...</h3></div>
    </main>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeOrderModal()">&times;</span>
            <h2>📋 Złóż zamówienie</h2>
            <p id="orderProductName" style="font-weight:bold;margin-bottom:1rem;"></p>
            <form id="orderForm">
                <input type="hidden" id="orderProduct">
                <div class="form-group"><label>Twoje imię *</label><input type="text" id="customerName" required></div>
                <div class="form-group"><label>Numer telefonu *</label><input type="tel" id="customerPhone" required placeholder="+48 123456789"></div>
                <button type="submit" class="btn btn-primary">📱 Zamawiam</button>
            </form>
            <div id="orderFeedback" style="margin-top:1rem;text-align:center;display:none;"></div>
        </div>
    </div>

    <footer class="footer"><p>&copy; 2026 Druk3D Shop</p></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./script.js"></script>
</body>
</html>
