<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Druk3D - Panel Administratora</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">⚙️</span>
                <h1>Panel Admina</h1>
            </div>
            <nav>
                <a href="./index.html" class="nav-link">Sklep</a>
                <a href="./admin.html" class="nav-link active">Panel Admina</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Ekran logowania -->
        <div id="loginScreen" class="login-screen">
            <div class="login-card">
                <h2>🔐 Zaloguj się</h2>
                <p>Wprowadź hasło administratora</p>
                <form id="loginForm" class="admin-form">
                    <div class="form-group">
                        <label for="loginPassword">Hasło administratora</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-primary">Zaloguj się</button>
                </form>
                <div id="loginError" class="form-feedback error" style="display: none;"></div>
                <button id="logoutBtn" class="btn btn-logout" style="display: none;">🚪 Wyloguj się</button>
            </div>
        </div>

        <!-- Panel admina (ukryty przed zalogowaniem) -->
        <div id="adminPanel" class="admin-layout" style="display: none;">
            <section class="admin-form-section">
                <h2>➕ Dodaj nowy produkt</h2>
                <form id="addProductForm" class="admin-form">
                    <div class="form-group">
                        <label for="productName">Nazwa produktu *</label>
                        <input type="text" id="productName" placeholder="np. Figurka smoka" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Cena (PLN) *</label>
                        <input type="number" id="productPrice" placeholder="np. 49.99" step="0.01" min="0.01" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="productImage">URL zdjęcia (opcjonalnie)</label>
                        <input type="text" id="productImage" placeholder="https://example.com/zdjecie.jpg" autocomplete="off">
                        <small>Zostaw puste – użyje ikony 🖨️</small>
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Opis produktu</label>
                        <textarea id="productDescription" rows="3" placeholder="Krótki opis wydruku..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Dodaj produkt</button>
                </form>
                <div id="formFeedback" class="form-feedback" style="display: none;"></div>
            </section>

            <section class="admin-products-section">
                <div class="section-header">
                    <h2>📋 Lista produktów</h2>
                    <span id="productCount" class="badge">0</span>
                </div>
                <div id="adminProductsList" class="admin-products-list"></div>
                <div id="adminEmpty" class="empty-message" style="display: none;">
                    <p>📦 Brak produktów. Dodaj pierwszy powyżej!</p>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; <span id="currentYear"></span> Druk3D Shop</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./script.js"></script>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
</body>
</html>
